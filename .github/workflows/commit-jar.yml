name: Build and commit jar

# Keeps the hatrix-1.0.0.jar committed at the repo root in sync with main. Fires on every
# push to main, rebuilds, and commits the jar back only if it actually changed. The commit
# message includes "[skip ci]" and the trigger ignores changes to the jar itself, so this
# can't retrigger itself in a loop.
on:
  push:
    branches: [main]
    paths-ignore:
      - "hatrix-1.0.0.jar"

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Copy jar to repo root
        run: cp build/libs/*.jar hatrix-1.0.0.jar

      - name: Commit updated jar, if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update built jar [skip ci]"
          file_pattern: hatrix-1.0.0.jar
